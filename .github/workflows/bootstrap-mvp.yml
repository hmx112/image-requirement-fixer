name: Bootstrap MVP source

on:
  push:
    branches: ["feat/mvp"]
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mvp
      - name: Rebuild source archive
        shell: bash
        run: |
          cat \
            .bootstrap/source.b64.00 .bootstrap/fix00.tail \
            .bootstrap/source.b64.01 \
            .bootstrap/source.b64.02 \
            .bootstrap/source.b64.03 \
            .bootstrap/source.b64.04 \
            .bootstrap/source.b64.05 \
            .bootstrap/source.b64.06 \
            .bootstrap/fix07.0 .bootstrap/fix07.1 .bootstrap/fix07.2 \
            .bootstrap/source.b64.08 | base64 -d > /tmp/source.zip
          echo "05af6a6371ee46bf23edfee08345d6523cd4d331e8b2b081d298844951020d84  /tmp/source.zip" | sha256sum -c -
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/source.zip') as z:
              bad = z.testzip()
              if bad is not None:
                  raise RuntimeError(f'Corrupt zip member: {bad}')
              z.extractall('.')
          PY
          rm -rf .bootstrap .github/workflows/bootstrap-mvp.yml
      - name: Commit expanded source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Image Requirement Fixer MVP" || exit 0
          git push origin HEAD:feat/mvp

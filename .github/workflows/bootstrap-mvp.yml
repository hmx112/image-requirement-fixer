name: Bootstrap MVP source

on:
  push:
    branches: ["feat/mvp"]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-mvp.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mvp
      - name: Rebuild source archive
        shell: bash
        run: |
          cat .bootstrap/source.b64.* | base64 -d > /tmp/source.zip
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/source.zip') as z:
              z.extractall('.')
          PY
          rm -rf .bootstrap .github/workflows/bootstrap-mvp.yml
      - name: Commit expanded source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Image Requirement Fixer MVP" || exit 0
          git push origin HEAD:feat/mvp

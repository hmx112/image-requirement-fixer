name: Bootstrap MVP source

on:
  push:
    branches: ["feat/mvp"]
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mvp
      - name: Rebuild source archive
        shell: bash
        run: |
          cat .bootstrap/part.* | base64 -d > /tmp/source.zip
          echo "05af6a6371ee46bf23edfee08345d6523cd4d331e8b2b081d298844951020d84  /tmp/source.zip" | sha256sum -c -
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/source.zip') as z:
              z.testzip() is None or (_ for _ in ()).throw(RuntimeError('Corrupt zip member'))
              z.extractall('.')
          PY
          rm -rf .bootstrap .github/workflows/bootstrap-mvp.yml
      - name: Commit expanded source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Image Requirement Fixer MVP" || exit 0
          git push origin HEAD:feat/mvp
